
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Purr & Pour Cafe</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/bootstrap.bundle.min.js"></script>
</head>

<body>

  <!-- NAVIGATION -->
  <nav class="navbar md:navbar-expand bg-1 border-bottom">
    <div class="container">

      <a class="navbar-brand" href="index.html">
        Purr & Pour Cafe
      </a>

      <button class="btn-icon navbar-toggler"
        type="button"
        data-bs-toggle="drawer"
        data-bs-target="#menu"
        aria-controls="menu"
        aria-expanded="false"
        aria-label="Open menu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <dialog class="drawer drawer-end" id="menu"
        aria-labelledby="menuTitle">

        <div class="drawer-header">
          <h2 class="drawer-title h5" id="menuTitle">
            Menu
          </h2>

          <button class="btn-close"
            type="button"
            data-bs-dismiss="drawer"
            aria-label="Close menu">
          </button>
        </div>

        <div class="drawer-body">
          <ul class="navbar-nav">

            <li class="nav-item">
              <a class="nav-link"
                href="index.html">Home</a>
            </li>

            <li class="nav-item">
              <a class="nav-link"
                href="#">Our Story</a>
            </li>

            <li class="nav-item">
              <a class="nav-link active"
                aria-current="page"
                href="Contact.html">Contact</a>
            </li>

          </ul>
        </div>

      </dialog>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <main class="container py-5">

    <header class="text-center mb-5">
      <h1>Contact Us</h1>
      <p class="lead">
        Have a question? We would love to hear from you!
      </p>
    </header>

    <!-- CONTACT FORM -->
    <form action="#" method="get">

      <div class="row g-4">

        <!-- FIRST NAME -->
        <div class="col-12 md:col-6">
          <div class="form-field">
            <label for="firstName">First Name</label>
            <input
              type="text"
              class="form-control"
              id="firstName"
              name="firstName"
              required>
          </div>
        </div>

        <!-- LAST NAME -->
        <div class="col-12 md:col-6">
          <div class="form-field">
            <label for="lastName">Last Name</label>
            <input
              type="text"
              class="form-control"
              id="lastName"
              name="lastName"
              required>
          </div>
        </div>

        <!-- EMAIL -->
        <div class="col-12 md:col-6">
          <div class="form-field">
            <label for="email">Email Address</label>
            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              placeholder="you@example.com"
              required>
          </div>
        </div>

        <!-- SELECT MENU -->
        <div class="col-12 md:col-6">
          <div class="form-field">
            <label for="topic">What is your question about?</label>
            <select
              class="form-control"
              id="topic"
              name="topic"
              required>

              <option value="">Choose a topic</option>
              <option value="visit">Visiting the Cafe</option>
              <option value="cats">Our Cats</option>
              <option value="events">Events</option>
              <option value="other">Other</option>

            </select>
          </div>
        </div>

        <!-- MESSAGE -->
        <div class="col-12">
          <div class="form-field">
            <label for="message">Your Message</label>
            <textarea
              class="form-control"
              id="message"
              name="message"
              rows="5"
              required></textarea>
          </div>
        </div>

        <!-- CONSENT CHECKBOX -->
        <div class="col-12">
          <div class="form-field">

            <input
              class="check"
              type="checkbox"
              id="consent"
              name="consent"
              required>

            <label for="consent">
              I agree to be contacted about my message.
            </label>

          </div>
        </div>

        <!-- SUBMIT BUTTON -->
        <div class="col-12">
          <button
            type="submit"
            class="btn-solid theme-primary">
            Send Message
          </button>
        </div>

      </div>

    </form>

    <p class="mt-4">
      This contact form is a demonstration for a class project.
    </p>

  </main>

  <!-- FOOTER -->
  <footer class="bg-1 text-center py-4">
    <p>Purr & Pour Cafe | Made with Love</p>
  </footer>

</body>
</html>
